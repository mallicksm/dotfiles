# kitty overrides for macOS. Symlinked into place as kitty.os.conf by
# ~/dotfiles/dotfiles.sh (link_kitty_os), based on `uname`.
#
# Force Homebrew's modern bash so we don't fall back to the ancient
# /bin/bash v3 that ships with macOS. Adjust to /usr/local/bin/bash on
# Intel Macs (Apple Silicon uses /opt/homebrew).
#
# --login follows Apple's Terminal.app convention (each window is a
# login shell, sourcing ~/.bash_profile). Don't pass --interactive:
# GNU bash rejects it as a long option; bash auto-detects interactive
# from the TTY anyway.
shell /opt/homebrew/bin/bash --login
