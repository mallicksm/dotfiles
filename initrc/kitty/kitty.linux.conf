# kitty overrides for Linux. Symlinked into place as kitty.os.conf by
# ~/dotfiles/dotfiles.sh (link_kitty_os), based on `uname`.
#
# Pin /usr/bin/bash explicitly. $SHELL is /bin/bash (chsh default) but
# we prefer the canonical /usr/bin/bash on this system. No flags:
# - bash auto-detects interactive when stdin is a TTY (kitty's PTY).
# - GNU bash rejects --interactive as a long option (use -i if needed).
# - On Linux convention, terminal windows are non-login interactive,
#   so ~/.bashrc runs; add --login if you also want ~/.bash_profile.
shell /usr/bin/bash
